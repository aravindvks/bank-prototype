server {
  listen 80;
  root /usr/share/nginx/html;
  # Live push (Server-Sent Events): no buffering, long-lived connection.
  location /v1/events {
    proxy_pass http://bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /v1/ { proxy_pass http://bff:8080; proxy_set_header X-Forwarded-For $remote_addr; }
  # Demo toolbar only (dev and demo environments): the vendor simulator.
  location /sim/ { proxy_pass http://vendor-simulator:8090/; }
  location / { try_files $uri /index.html; }
}
