# Tempo, single binary, local disk (LLD section 15). Traces kept for 48 hours locally.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
compactor:
  compaction:
    block_retention: 48h
storage:
  trace:
    backend: local
    wal: { path: /tmp/tempo/wal }
    local: { path: /tmp/tempo/blocks }
