# Prometheus (LLD section 17): scrapes every service's /actuator/prometheus, Temporal and Kafka lag.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pbp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - bff:8080
          - orchestrator:8081
          - mapping-service:8082
          - ehi-responder:8083
          - essence-adapter:8084
          - thredd-adapter:8085
          - atfinity-adapter:8086
          - recon-service:8087
          - vendor-simulator:8090
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
  - job_name: temporal
    static_configs:
      - targets: [temporal:8000]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
