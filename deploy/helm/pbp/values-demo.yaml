# Demo environment: simulators on, smaller footprint.
env: demo
services:
  bff:              { port: 8080, min: 1, max: 2, cpu: 250m, memory: 768Mi, scaleCpu: 70 }
  orchestrator:     { port: 8081, min: 1, max: 2, cpu: 500m, memory: 1Gi, scaleCpu: 70 }
  mapping-service:  { port: 8082, min: 1, max: 2, cpu: 250m, memory: 768Mi, scaleCpu: 70 }
  ehi-responder:    { port: 8083, min: 2, max: 3, cpu: 500m, memory: 1Gi, scaleCpu: 60 }
  essence-adapter:  { port: 8084, min: 1, max: 2, cpu: 250m, memory: 768Mi, scaleCpu: 60 }
  thredd-adapter:   { port: 8085, min: 1, max: 1, cpu: 250m, memory: 768Mi }
  atfinity-adapter: { port: 8086, min: 1, max: 1, cpu: 250m, memory: 768Mi }
  recon-service:    { port: 8087, min: 1, max: 1, cpu: 250m, memory: 768Mi }
  vendor-simulator: { port: 8090, min: 1, max: 1, cpu: 250m, memory: 768Mi, enabled: true }
  web:              { port: 80,   min: 1, max: 2, cpu: 100m, memory: 128Mi, probePath: / }
