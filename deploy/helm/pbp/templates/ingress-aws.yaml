{{- if and (eq .Values.cloud "aws") .Values.services.web }}
# AWS public entry for the web app (which proxies /v1 to the BFF): an internet-facing ALB created by the
# AWS Load Balancer Controller, with TLS from ACM and the WAF web ACL from infra/terraform/aws. On OCI the
# same role is played by API Gateway, on Azure by the Application Gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.aws.webCertificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.aws.wafAclArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.aws.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
{{- end }}
