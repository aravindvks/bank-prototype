{{- /*
Observability on OKE (LLD section 17): the same Grafana, Prometheus, Tempo and Loki as locally, installed
from their upstream charts into the "observability" namespace (kube-prometheus-stack, tempo, loki,
opentelemetry-collector). This chart only adds what is ours: the scrape config, the alert rules and the
dashboards. The deploy workflow copies infra/observability into files/observability before helm runs.
*/ -}}
{{- if .Values.observability.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pbp
  labels:
    release: {{ .Values.observability.prometheusRelease }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: pbp
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: NotIn, values: [web] }
  podMetricsEndpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
      # Same job name as locally, so alerts.yml and the dashboards work unchanged.
        - targetLabel: job
          replacement: pbp
{{- with .Files.Get "files/observability/prometheus/alerts.yml" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pbp-alerts
  labels:
    release: {{ $.Values.observability.prometheusRelease }}
spec:
{{ . | indent 2 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/observability/grafana/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "dashboard-%s" (base $path | trimSuffix ".json") }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Banking Platform Prototype
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
