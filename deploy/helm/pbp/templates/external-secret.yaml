{{- if .Values.externalSecrets.enabled }}
# Syncs the service Secret from OCI Vault with the External Secrets Operator.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: {{ .Values.secretName }}
  data:
    {{- range $key := list "DB_USER" "DB_PASSWORD" "WEBHOOK_SECRET" "SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG" }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ printf "pbp-%s-%s" $.Values.env ($key | lower | replace "_" "-") }}
    {{- end }}
{{- end }}
