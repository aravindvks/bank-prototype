{{- if .Values.ehiLoadBalancer.enabled }}
# Dedicated public listener for Thredd's EHI calls (HLD: separate path, not API Gateway).
# TLS terminates at the OCI load balancer; only Thredd's ranges may connect; WAF is attached by Terraform.
apiVersion: v1
kind: Service
metadata:
  name: ehi-public
  labels:
    app.kubernetes.io/name: ehi-responder
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: flexible
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: {{ .Values.ehiLoadBalancer.shapeMinMbps | quote }}
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: {{ .Values.ehiLoadBalancer.shapeMaxMbps | quote }}
    service.beta.kubernetes.io/oci-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/oci-load-balancer-tls-secret: {{ .Values.ehiLoadBalancer.tlsSecret | quote }}
    service.beta.kubernetes.io/oci-load-balancer-backend-protocol: HTTP
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  {{- with .Values.ehiLoadBalancer.sourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app.kubernetes.io/name: ehi-responder
  ports:
    - name: https
      port: 443
      targetPort: http
{{- end }}
