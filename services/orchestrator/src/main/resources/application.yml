server:
  port: ${PORT:8081}
spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbp}?currentSchema=orchestration
    username: ${DB_USER:pbp}
    password: ${DB_PASSWORD:pbp}
  flyway:
    schemas: orchestration
    default-schema: orchestration
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:pbp-local}
pbp:
  events:
    # outbox: Debezium relays events from the outbox table (Docker Compose, OCI); direct: straight to Kafka.
    mode: ${EVENTS_MODE:direct}
  correlation:
    default-type: PAY
  bank:
    sort-code: ${BANK_SORT_CODE:200001}
  payments:
    # Single-payment limit in GBP for same-bank and Faster Payments.
    single-limit: 25000.00
    # Payments at or above this amount are HELD until a member of staff approves them.
    review-threshold: ${PAYMENT_REVIEW_THRESHOLD:10000.00}
    chaps:
      limit: 1000000.00
      fee: ${CHAPS_FEE:20.00}
      # The bank's CHAPS hours, UK time, Monday to Friday (CHAPS settles 06:00-18:00).
      opens: "${CHAPS_OPENS:06:00}"
      cut-off: "${CHAPS_CUT_OFF:17:30}"
      # England and Wales bank holidays, comma-separated ISO dates.
      holidays: "${CHAPS_HOLIDAYS:2026-12-25,2026-12-28,2027-01-01,2027-03-26,2027-03-29,2027-05-03,2027-05-31,2027-08-30,2027-12-27,2027-12-28}"
  adapters:
    essence-url: ${ESSENCE_ADAPTER_URL:http://localhost:8084}
  services:
    mapping-url: ${MAPPING_URL:http://localhost:8082}
    atfinity-adapter-url: ${ATFINITY_ADAPTER_URL:http://localhost:8086}
    thredd-adapter-url: ${THREDD_ADAPTER_URL:http://localhost:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
