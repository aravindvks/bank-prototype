server:
  port: ${PORT:8081}
spring:
  application:
    name: orchestrator
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbp}?currentSchema=orchestration
    username: ${DB_USER:pbp}
    password: ${DB_PASSWORD:pbp}
  flyway:
    schemas: orchestration
    default-schema: orchestration
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
temporal:
  target: ${TEMPORAL_TARGET:localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:pbp-local}
pbp:
  correlation:
    default-type: PAY
  bank:
    sort-code: ${BANK_SORT_CODE:200001}
  payments:
    # Single-payment limit in GBP. The daily limit check arrives with the limits table in Phase 1.
    single-limit: 25000.00
  adapters:
    essence-url: ${ESSENCE_ADAPTER_URL:http://localhost:8084}
  services:
    mapping-url: ${MAPPING_URL:http://localhost:8082}
    atfinity-adapter-url: ${ATFINITY_ADAPTER_URL:http://localhost:8086}
    thredd-adapter-url: ${THREDD_ADAPTER_URL:http://localhost:8085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
