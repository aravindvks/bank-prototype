// Orchestrator: Temporal workflows that glue the vendors together for every journey (LLD section 3).
dependencies {
    implementation "io.temporal:temporal-sdk:${rootProject.temporalVersion}"
    // Observability (LLD section 15): workflow and activity spans join the caller's trace.
    implementation "io.temporal:temporal-opentracing:${rootProject.temporalVersion}"
    implementation 'io.opentelemetry:opentelemetry-opentracing-shim:1.37.0'   // same OpenTelemetry release as Spring Boot 3.3.5
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation "io.temporal:temporal-testing:${rootProject.temporalVersion}"
}
