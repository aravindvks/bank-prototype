server:
  port: ${PORT:8080}
spring:
  application:
    name: bff
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/pbp/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbp}?currentSchema=bff
    username: ${DB_USER:pbp}
    password: ${DB_PASSWORD:pbp}
  flyway:
    schemas: bff
    default-schema: bff
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
pbp:
  auth:
    # true: OAuth2 bearer tokens from Identity Domains (Keycloak locally) are required.
    # false: development headers X-Customer-Id and X-Staff-User (IDE runs only).
    enabled: ${AUTH_ENABLED:false}
  events:
    # outbox: Debezium relays events from the outbox table (Docker Compose, OCI); direct: straight to Kafka.
    mode: ${EVENTS_MODE:direct}
  correlation:
    default-type: TXN
  bank:
    sort-code: ${BANK_SORT_CODE:200001}
  services:
    orchestrator-url: ${ORCHESTRATOR_URL:http://localhost:8081}
    mapping-url: ${MAPPING_URL:http://localhost:8082}
    essence-adapter-url: ${ESSENCE_ADAPTER_URL:http://localhost:8084}
    recon-url: ${RECON_URL:http://localhost:8087}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
