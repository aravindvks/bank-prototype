server:
  port: ${PORT:8082}
spring:
  application:
    name: mapping-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbp}?currentSchema=mapping
    username: ${DB_USER:pbp}
    password: ${DB_PASSWORD:pbp}
  flyway:
    schemas: mapping
    default-schema: mapping
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
pbp:
  events:
    # outbox: Debezium relays events from the outbox table (Docker Compose, OCI); direct: straight to Kafka.
    mode: ${EVENTS_MODE:direct}
  correlation:
    default-type: CUS
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
